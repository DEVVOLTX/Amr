/* ════════════════════════════════════════════
   01 — RESET & CSS VARIABLES
════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Dark Theme (default) */
  --bg:           #04050a;
  --bg2:          #080b14;
  --fg:           #e8e8f0;
  --fg-dim:       #6b6b80;
  --fg-muted:     #3a3a50;
  --purple:       #9d4edd;
  --cyan:         #00e5ff;
  --pink:         #f72585;
  --gold:         #ffd60a;
  --border:       rgba(255,255,255,0.06);
  --card:         rgba(255,255,255,0.025);
  --card-hover:   rgba(255,255,255,0.05);
  --shadow:       rgba(0,0,0,0.5);
  --mono:         'JetBrains Mono', monospace;
  --sans:         'Inter', sans-serif;
  --radius:       12px;
  --transition:   0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="light"] {
  --bg:           #f0f0f8;
  --bg2:          #e8e8f5;
  --fg:           #0a0a14;
  --fg-dim:       #5a5a70;
  --fg-muted:     #c0c0d8;
  --border:       rgba(0,0,0,0.08);
  --card:         rgba(255,255,255,0.8);
  --card-hover:   rgba(255,255,255,0.95);
  --shadow:       rgba(0,0,0,0.12);
}

html { scroll-behavior: auto; } /* Lenis handles this */
body {
  background:  var(--bg);
  color:       var(--fg);
  font-family: var(--sans);
  overflow-x:  hidden;
  cursor:      none;
  line-height: 1.6;
  transition:  background var(--transition), color var(--transition);
}

/* ════════════════════════════════════════════
   02 — SKIP TO CONTENT (Accessibility)
════════════════════════════════════════════ */
.skip-link {
  position: absolute; top: -999px; left: 1rem; z-index: 9999;
  background: var(--purple); color: #fff; padding: .5rem 1rem;
  border-radius: 4px; font-family: var(--mono); font-size: .8rem;
  text-decoration: none;
}
.skip-link:focus { top: 1rem; }

/* ════════════════════════════════════════════
   03 — CUSTOM CURSOR
════════════════════════════════════════════ */
#cur-ring {
  position: fixed; width: 36px; height: 36px;
  border: 2px solid var(--purple); border-radius: 50%;
  pointer-events: none; z-index: 9999;
  transform: translate(-50%,-50%);
  transition: width .25s, height .25s, border-color .25s, background .25s, opacity .3s;
  mix-blend-mode: exclusion;
}
#cur-dot {
  position: fixed; width: 5px; height: 5px;
  background: var(--cyan); border-radius: 50%;
  pointer-events: none; z-index: 9999;
  transform: translate(-50%,-50%);
  transition: transform .1s;
}

/* Cursor trails */
.cur-trail {
  position: fixed; width: 6px; height: 6px;
  border-radius: 50%; pointer-events: none; z-index: 9998;
  transform: translate(-50%,-50%);
  transition: opacity .5s;
}

/* Hover states */
body:has(a:hover) #cur-ring,
body:has(button:hover) #cur-ring {
  width: 60px; height: 60px;
  border-color: var(--cyan);
  background: rgba(0,212,232,0.05);
}

/* Mouse glow */
#mouse-glow {
  position: fixed; width: 400px; height: 400px;
  border-radius: 50%; pointer-events: none; z-index: 0;
  background: radial-gradient(circle, rgba(11,89,101,0.08) 0%, transparent 70%);
  transform: translate(-50%,-50%);
  transition: opacity .3s;
}

/* ════════════════════════════════════════════
   04 — LOADER
════════════════════════════════════════════ */
#loader {
  position: fixed; inset: 0; z-index: 9000;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2rem;
}
#loader.hide { pointer-events: none; }

.loader-logo {
  font-family: var(--mono); font-size: 2.2rem;
  letter-spacing: .4em; color: var(--fg);
  position: relative;
}
.loader-logo span {
  background: linear-gradient(90deg, var(--purple), var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.loader-logo::after {
  content: ''; position: absolute; bottom: -4px; left: 0; right: 0;
  height: 1px; background: linear-gradient(90deg, var(--purple), var(--cyan), transparent);
}

.loader-bar-wrap {
  width: 280px; height: 1px;
  background: var(--border); border-radius: 2px; overflow: hidden;
}
.loader-bar {
  height: 100%; width: 0;
  background: linear-gradient(90deg, var(--purple), var(--cyan), var(--pink));
}
.loader-pct { font-family: var(--mono); font-size: .68rem; color: var(--fg-dim); letter-spacing: .3em; }
.loader-status { font-family: var(--mono); font-size: .6rem; color: var(--fg-muted); letter-spacing: .2em; height: 1em; }

/* ════════════════════════════════════════════
   05 — BACKGROUND (Aurora + Noise + Particles)
════════════════════════════════════════════ */
#bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* Aurora */
.aurora {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  overflow: hidden;
}
.aurora-blob {
  position: absolute; border-radius: 50%; filter: blur(80px); opacity: .12;
  animation: aurora-drift linear infinite;
}
.aurora-blob:nth-child(1) {
  width: 600px; height: 600px; top: -200px; left: -100px;
  background: var(--purple); animation-duration: 18s;
}
.aurora-blob:nth-child(2) {
  width: 500px; height: 500px; top: 30%; right: -150px;
  background: var(--cyan); animation-duration: 22s; animation-direction: reverse;
}
.aurora-blob:nth-child(3) {
  width: 400px; height: 400px; bottom: -100px; left: 30%;
  background: var(--pink); animation-duration: 26s;
}
.aurora-blob:nth-child(4) {
  width: 350px; height: 350px; top: 60%; left: -50px;
  background: var(--cyan); animation-duration: 20s; animation-direction: reverse;
}

@keyframes aurora-drift {
  0%   { transform: translate(0,0) scale(1); }
  33%  { transform: translate(60px,-40px) scale(1.1); }
  66%  { transform: translate(-40px,60px) scale(.95); }
  100% { transform: translate(0,0) scale(1); }
}

/* Noise overlay */
.noise {
  position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px 200px;
}

/* ════════════════════════════════════════════
   06 — SCROLL PROGRESS
════════════════════════════════════════════ */
#scroll-progress {
  position: fixed; top: 0; left: 0; height: 2px; z-index: 200;
  background: linear-gradient(90deg, var(--purple), var(--cyan), var(--pink));
  width: 0; transform-origin: left;
}

/* ════════════════════════════════════════════
   07 — NAVIGATION
════════════════════════════════════════════ */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 1rem 2rem;
  background: rgba(7,11,14,0.75);
  backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
  transition: background var(--transition);
}

[data-theme="light"] nav { background: rgba(238,245,247,.85); }

.nav-logo {
  font-family: var(--mono); font-size: .95rem; font-weight: 700;
  letter-spacing: .2em; color: var(--fg); text-decoration: none;
  transition: text-shadow var(--transition);
}
.nav-logo:hover { text-shadow: 0 0 30px rgba(11,89,101,.8); }

.nav-center {
  display: flex; align-items: center; gap: .3rem;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 30px; padding: .3rem .5rem;
  backdrop-filter: blur(10px);
}

.nav-link {
  font-family: var(--mono); font-size: .62rem; letter-spacing: .12em;
  color: var(--fg-dim); text-decoration: none;
  padding: .35rem .8rem; border-radius: 20px;
  transition: all .2s;
  position: relative;
}
.nav-link:hover { color: var(--fg); background: var(--card-hover); }
.nav-link.active { color: var(--fg); background: rgba(11,89,101,.2); }

.nav-right { display: flex; align-items: center; gap: .8rem; }

/* Theme toggle */
#theme-toggle {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--card); border: 1px solid var(--border);
  color: var(--fg-dim); font-size: .9rem;
  display: flex; align-items: center; justify-content: center;
  cursor: none; transition: all .2s;
}
#theme-toggle:hover { border-color: var(--purple); color: var(--purple); }

/* Command palette trigger */
#cmd-trigger {
  font-family: var(--mono); font-size: .62rem; letter-spacing: .08em;
  color: var(--fg-dim); background: var(--card);
  border: 1px solid var(--border); border-radius: 6px;
  padding: .3rem .7rem; cursor: none;
  display: flex; align-items: center; gap: .4rem;
  transition: all .2s;
}
#cmd-trigger:hover { border-color: var(--purple); color: var(--fg); }
#cmd-trigger kbd {
  font-family: var(--mono); font-size: .55rem;
  background: var(--border); padding: .1rem .3rem;
  border-radius: 3px; color: var(--fg-dim);
}

.nav-cv {
  font-family: var(--mono); font-size: .7rem; letter-spacing: .1em;
  color: var(--fg); border: 1px solid var(--purple);
  padding: .4rem .9rem; border-radius: 6px; text-decoration: none;
  background: rgba(11,89,101,.1);
  transition: all .2s; position: relative; overflow: hidden;
}
.nav-cv::before {
  content: ''; position: absolute; inset: 0;
  background: var(--purple); transform: translateX(-101%);
  transition: transform .3s; z-index: -1;
}
.nav-cv:hover::before { transform: translateX(0); }
.nav-cv:hover { color: #fff; }

/* ════════════════════════════════════════════
   08 — COMMAND PALETTE
════════════════════════════════════════════ */
#cmd-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(7,11,14,.8); backdrop-filter: blur(20px);
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 15vh;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
#cmd-overlay.open { opacity: 1; pointer-events: auto; }

#cmd-palette {
  width: 100%; max-width: 580px; margin: 0 1rem;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden;
  box-shadow: 0 40px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(11,89,101,.2);
  transform: translateY(-20px); transition: transform .2s;
}
#cmd-overlay.open #cmd-palette { transform: translateY(0); }

.cmd-search {
  display: flex; align-items: center; gap: 1rem;
  padding: 1rem 1.2rem; border-bottom: 1px solid var(--border);
}
.cmd-search-icon { color: var(--fg-dim); font-size: 1rem; flex-shrink: 0; }
#cmd-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--fg); font-family: var(--mono); font-size: .9rem;
}
#cmd-input::placeholder { color: var(--fg-dim); }
.cmd-esc {
  font-family: var(--mono); font-size: .6rem; color: var(--fg-muted);
  background: var(--border); padding: .2rem .5rem; border-radius: 4px;
}

.cmd-results { padding: .5rem; max-height: 320px; overflow-y: auto; }
.cmd-group-label {
  font-family: var(--mono); font-size: .58rem; letter-spacing: .2em;
  color: var(--fg-muted); padding: .5rem .8rem .3rem;
}
.cmd-item {
  display: flex; align-items: center; gap: .8rem;
  padding: .7rem .8rem; border-radius: 8px; cursor: none;
  transition: background .15s; color: var(--fg);
  font-family: var(--mono); font-size: .78rem;
}
.cmd-item:hover, .cmd-item.selected {
  background: rgba(11,89,101,.12);
}
.cmd-item-icon { font-size: 1rem; width: 20px; text-align: center; }
.cmd-item-label { flex: 1; }
.cmd-item-shortcut { font-size: .6rem; color: var(--fg-dim); }

/* ════════════════════════════════════════════
   09 — LIGHTBOX
════════════════════════════════════════════ */
#lightbox {
  position: fixed; inset: 0; z-index: 800;
  background: rgba(7,11,14,.95); backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
#lightbox.open { opacity: 1; pointer-events: auto; }

#lightbox-img {
  max-width: 90vw; max-height: 85vh;
  border-radius: 12px;
  box-shadow: 0 0 80px rgba(11,89,101,.3);
  object-fit: contain;
  transform: scale(.9); transition: transform .3s;
}
#lightbox.open #lightbox-img { transform: scale(1); }

.lb-close {
  position: absolute; top: 1.5rem; right: 1.5rem;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--card); border: 1px solid var(--border);
  color: var(--fg); font-size: 1.2rem; cursor: none;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.lb-close:hover { border-color: var(--pink); color: var(--pink); }

.lb-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--card); border: 1px solid var(--border);
  color: var(--fg); font-size: 1.2rem; cursor: none;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.lb-nav:hover { border-color: var(--purple); background: rgba(11,89,101,.15); }
.lb-prev { left: 1.5rem; }
.lb-next { right: 1.5rem; }
.lb-counter {
  position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
  font-family: var(--mono); font-size: .65rem; letter-spacing: .2em; color: var(--fg-dim);
}

/* ════════════════════════════════════════════
   10 — HERO
════════════════════════════════════════════ */
section { position: relative; z-index: 1; }

#hero {
  min-height: 100vh;
  display: flex; flex-direction: row; flex-wrap: wrap;
  align-items: center; justify-content: space-between;
  padding: 8rem 2rem 4rem; max-width: 1200px; gap: 2rem;
}

#hero-text { flex: 1; min-width: 280px; }

.hero-tag {
  font-family: var(--mono); font-size: .65rem; letter-spacing: .25em;
  color: var(--purple); margin-bottom: 1.2rem;
  display: flex; align-items: center; gap: .6rem;
  opacity: 0;
}
.hero-tag::before {
  content: ''; width: 30px; height: 1px; background: var(--purple);
}

.hero-name {
  font-size: clamp(3.5rem,13vw,7rem); font-weight: 900;
  line-height: .95; letter-spacing: -.03em; margin-bottom: .15em;
  overflow: hidden;
}
.hero-name .line { display: block; overflow: hidden; }
.hero-name .w { color: var(--fg); display: inline-block; }
.hero-name .g {
  background: linear-gradient(135deg, var(--purple), var(--cyan), var(--pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; display: inline-block;
}

.hero-role {
  font-family: var(--mono); font-size: 1.1rem;
  color: var(--cyan); margin: 1.5rem 0;
  opacity: 0;
}
.blink {
  display: inline-block; width: 2px; height: 1.1em;
  background: var(--cyan); animation: blink 1s step-end infinite;
  vertical-align: middle;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

.hero-desc {
  color: var(--fg-dim); font-size: 1rem;
  max-width: 500px; margin-bottom: 2rem; line-height: 1.8;
  opacity: 0;
}

.hero-btns { display: flex; gap: 1rem; flex-wrap: wrap; opacity: 0; }

/* Magnetic button wrapper */
.magnetic-wrap { display: inline-block; }

.btn-primary {
  display: inline-flex; align-items: center; gap: .6rem;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #fff; font-family: var(--mono); font-size: .78rem;
  letter-spacing: .12em; padding: .9rem 2rem; border-radius: 8px;
  text-decoration: none; font-weight: 700;
  box-shadow: 0 4px 0 #063840, 0 8px 30px rgba(11,89,101,.35);
  position: relative; overflow: hidden; transition: transform .15s, box-shadow .15s;
}
.btn-primary::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,.15));
  opacity: 0; transition: opacity .2s;
}
.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 7px 0 #063840, 0 15px 35px rgba(11,89,101,.45); }
.btn-primary:hover::after { opacity: 1; }
.btn-primary:active { transform: translateY(1px); }

.btn-secondary {
  display: inline-flex; align-items: center; gap: .6rem;
  color: var(--cyan); font-family: var(--mono); font-size: .78rem;
  letter-spacing: .12em; padding: .9rem 2rem; border-radius: 8px;
  text-decoration: none; font-weight: 700;
  border: 1px solid rgba(0,212,232,.4);
  background: rgba(0,212,232,.05);
  transition: all .2s; position: relative; overflow: hidden;
}
.btn-secondary:hover { background: rgba(0,212,232,.1); box-shadow: 0 0 30px rgba(0,212,232,.2); }

/* Ripple */
.ripple-effect {
  position: absolute; border-radius: 50%;
  background: rgba(255,255,255,.3);
  transform: scale(0); animation: ripple .6s linear;
  pointer-events: none;
}
@keyframes ripple { to { transform: scale(4); opacity: 0; } }

.hero-stats {
  display: flex; gap: 2.5rem; margin-top: 2.5rem; flex-wrap: wrap;
  opacity: 0;
}
.stat { display: flex; flex-direction: column; gap: .2rem; }
.stat-num {
  font-size: 2rem; font-weight: 900;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.stat-label { font-family: var(--mono); font-size: .58rem; letter-spacing: .2em; color: var(--fg-dim); }

/* Avatar */
.avatar-wrap {
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  position: relative; opacity: 0;
}
.avatar-glow {
  position: absolute; width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, rgba(11,89,101,.25) 0%, transparent 70%);
  animation: pulse-glow 3s ease-in-out infinite;
}
@keyframes pulse-glow { 0%,100%{transform:scale(1);opacity:.5} 50%{transform:scale(1.2);opacity:1} }

.orbit { position: absolute; border-radius: 50%; border: 1px solid rgba(11,89,101,.15); animation: orbit-spin linear infinite; }
.orbit-1 { width: 310px; height: 310px; animation-duration: 14s; }
.orbit-2 { width: 380px; height: 380px; animation-duration: 22s; animation-direction: reverse; border-style: dashed; border-color: rgba(0,212,232,.1); }
@keyframes orbit-spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
.orbit-dot { position: absolute; top: -5px; left: 50%; transform: translateX(-50%); width: 10px; height: 10px; border-radius: 50%; }
.orbit-1 .orbit-dot { background: var(--purple); box-shadow: 0 0 12px var(--purple); }
.orbit-2 .orbit-dot { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }

.avatar-ring {
  width: 250px; height: 250px; border-radius: 50%; padding: 3px;
  background: conic-gradient(from 0deg, var(--purple), var(--cyan), var(--pink), var(--purple));
  /* isolate effects so the avatar image never gets tinted/shifted */
  isolation: isolate;
  animation: none; /* stop avatar float to avoid color/skin flicker */
  position: relative; z-index: 1;
}
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }
.avatar-ring img {
  width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
  filter: none !important;
  transform: translateZ(0);
}
.avatar-wrap { isolation: isolate; }

/* Ticker */
#hero .ticker { width: 100%; flex-basis: 100%; margin-top: 4rem; }
.ticker { overflow: hidden; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: .8rem 0; }
.ticker-track { display: flex; gap: 2rem; animation: ticker 22s linear infinite; white-space: nowrap; width: max-content; }
.ticker-item { font-family: var(--mono); font-size: .68rem; letter-spacing: .2em; color: var(--fg-dim); display: flex; align-items: center; gap: .8rem; }
.ticker-item::after { content: '◆'; color: var(--purple); }
@keyframes ticker { from{transform:translateX(0)} to{transform:translateX(-50%)} }

/* ════════════════════════════════════════════
   11 — SECTION LABELS
════════════════════════════════════════════ */
.sec-label {
  display: flex; align-items: center; gap: .75rem;
  font-family: var(--mono); font-size: .72rem; letter-spacing: .2em; color: var(--fg-dim);
  padding: 5rem 2rem 0; position: relative; overflow: hidden;
}
.sec-label .sec-slash { color: var(--purple); font-size: 1.2rem; }
.sec-label .sec-num {
  position: absolute; left: 0; font-size: 7rem; font-weight: 900;
  color: transparent; line-height: 1; z-index: -1; top: 2.5rem;
  -webkit-text-stroke: 1px rgba(11,89,101,.06);
}

/* ════════════════════════════════════════════
   12 — ABOUT
════════════════════════════════════════════ */
#about { padding: 1.5rem 2rem 5rem; max-width: 900px; }
.about-title { font-size: clamp(1.8rem,5vw,3rem); font-weight: 900; line-height: 1.15; margin-bottom: 1.5rem; }
.about-title .highlight { background: linear-gradient(90deg, var(--purple), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.about-body { color: var(--fg-dim); font-size: 1rem; line-height: 1.85; margin-bottom: 2.5rem; max-width: 650px; }

.edu-cards { display: flex; flex-direction: column; gap: .8rem; }
.edu-card {
  border: 1px solid var(--border); border-left: 3px solid var(--purple);
  background: var(--card); padding: 1.3rem 1.6rem; border-radius: var(--radius);
  display: flex; justify-content: space-between; align-items: center;
  transition: all var(--transition); backdrop-filter: blur(10px);
}
.edu-card:hover { border-left-color: var(--cyan); background: var(--card-hover); transform: translateX(6px); }
.edu-card-left .school { font-size: 1.1rem; font-weight: 700; margin-bottom: .25rem; }
.edu-card-left .dept { color: var(--fg-dim); font-size: .85rem; }
.badge {
  font-family: var(--mono); font-size: .68rem; color: var(--purple);
  border: 1px solid var(--purple); padding: .3rem .9rem;
  border-radius: 20px; white-space: nowrap; background: rgba(11,89,101,.08);
}

/* ════════════════════════════════════════════
   13 — PROJECTS
════════════════════════════════════════════ */
#projects { padding: 0 2rem 5rem; }

.project-item {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 2rem; margin-bottom: 1rem;
  background: var(--card); backdrop-filter: blur(10px);
  transition: all var(--transition); position: relative; overflow: hidden;
}
.project-item::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--purple), transparent);
  transform: scaleX(0); transition: transform .4s;
}
.project-item:hover::before { transform: scaleX(1); }
.project-item:hover { border-color: rgba(11,89,101,.25); box-shadow: 0 20px 40px rgba(0,0,0,.3); }

.project-header { display: flex; align-items: center; gap: .8rem; cursor: none; }
.project-num { font-family: var(--mono); font-size: .62rem; color: var(--fg-dim); letter-spacing: .15em; }
.project-name { font-size: 1.15rem; font-weight: 700; letter-spacing: .04em; color: var(--fg); }
.project-dot {
  margin-left: auto; width: 10px; height: 10px; border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), var(--cyan));
  box-shadow: 0 0 10px var(--purple); transition: transform .3s;
}
.project-item:hover .project-dot { transform: scale(1.5) rotate(180deg); }

.project-body { display: none; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
.project-body.open { display: block; }
.project-desc { font-size: clamp(1.2rem,3.5vw,1.7rem); font-weight: 700; line-height: 1.3; margin-bottom: 1rem; }
.project-detail { color: var(--fg-dim); font-size: .9rem; line-height: 1.75; margin-bottom: 1.5rem; }

.btn-outline {
  display: inline-flex; align-items: center; gap: .5rem;
  font-family: var(--mono); font-size: .7rem; letter-spacing: .1em;
  color: var(--fg); border: 1px solid var(--border);
  padding: .55rem 1.2rem; border-radius: 6px; text-decoration: none;
  margin-bottom: 1.5rem; transition: all .2s; position: relative; overflow: hidden;
}
.btn-outline:hover { border-color: var(--purple); color: var(--purple); background: rgba(11,89,101,.06); }

.meta-card {
  border: 1px solid var(--border); border-radius: 8px; padding: 1.2rem;
  display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
  margin-bottom: 1.5rem; background: rgba(0,0,0,.2);
}
.meta-key { font-family: var(--mono); font-size: .6rem; letter-spacing: .15em; color: var(--fg-dim); margin-bottom: .3rem; }
.meta-val { color: var(--cyan); font-weight: 700; font-size: 1rem; }
.meta-val.white { color: var(--fg); }

.tags { display: flex; flex-wrap: wrap; gap: .5rem; }
.tag {
  font-family: var(--mono); font-size: .63rem; letter-spacing: .1em;
  border: 1px solid rgba(11,89,101,.3); padding: .3rem .8rem;
  border-radius: 20px; color: var(--purple);
  background: rgba(11,89,101,.06); transition: all .2s;
}
.tag:hover { background: rgba(11,89,101,.18); transform: translateY(-2px); }

/* ════════════════════════════════════════════
   14 — SKILLS
════════════════════════════════════════════ */
#skills { padding: 0 2rem 5rem; }
.skill-cat { margin-bottom: 3rem; }
.skill-cat-title { font-family: var(--mono); font-size: .7rem; letter-spacing: .25em; color: var(--fg-dim); margin-bottom: 1.2rem; padding-bottom: .6rem; border-bottom: 1px solid var(--border); }
.skill-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: .8rem; }
.skill-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 1.3rem; display: flex; flex-direction: column; align-items: center; gap: .6rem;
  font-size: .85rem; color: var(--fg-dim); transition: all .3s; will-change: transform;
  backdrop-filter: blur(10px); position: relative; overflow: hidden;
}
.skill-card::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(11,89,101,.06), rgba(0,212,232,.03));
  opacity: 0; transition: opacity .3s;
}
.skill-card:hover { border-color: rgba(11,89,101,.4); color: var(--fg); }
.skill-card:hover::before { opacity: 1; }
.skill-icon { font-size: 1.8rem; }
.skill-letter { font-family: var(--mono); font-size: 2rem; font-weight: 700; color: rgba(255,255,255,.1); }

/* ════════════════════════════════════════════
   15 — CERTIFICATES
════════════════════════════════════════════ */
#certificates { padding: 0 2rem 5rem; }
.cert-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 1rem; }
.cert-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1.5rem 1.3rem; display: flex; flex-direction: column; gap: .6rem;
  position: relative; overflow: hidden; transition: all .3s; will-change: transform;
  backdrop-filter: blur(10px);
}
.cert-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--purple), var(--cyan), var(--pink));
}
.cert-card:hover { border-color: rgba(11,89,101,.35); transform: translateY(-4px); box-shadow: 0 20px 50px rgba(0,0,0,.3), 0 0 40px rgba(11,89,101,.1); }
.cert-issuer { font-family: var(--mono); font-size: .57rem; letter-spacing: .2em; color: var(--fg-dim); }
.cert-name { font-size: .95rem; font-weight: 700; line-height: 1.3; color: var(--fg); }
.cert-date { font-family: var(--mono); font-size: .62rem; color: var(--purple); }
.cert-extra { font-family: var(--mono); font-size: .6rem; color: var(--cyan); line-height: 1.6; }
.cert-link {
  display: inline-flex; align-items: center; gap: .4rem; margin-top: .4rem;
  font-family: var(--mono); font-size: .65rem; letter-spacing: .08em;
  color: var(--fg); border: 1px solid var(--border); padding: .4rem .8rem;
  border-radius: 6px; text-decoration: none; align-self: flex-start; transition: all .2s;
}
.cert-link:hover { border-color: var(--cyan); color: var(--cyan); }

/* ════════════════════════════════════════════
   16 — STATS
════════════════════════════════════════════ */
#stats { padding: 0 2rem 5rem; }
.stats-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 1rem; }
.stat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 2rem 1.5rem; text-align: center; position: relative; overflow: hidden;
  transition: all .3s; backdrop-filter: blur(10px);
}
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--purple), var(--cyan)); }
.stat-card:hover { border-color: rgba(11,89,101,.3); transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,.3), 0 0 30px rgba(11,89,101,.1); }
.stat-card-num {
  font-size: 3.5rem; font-weight: 900; line-height: 1; margin-bottom: .5rem;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.stat-card-label { font-family: var(--mono); font-size: .63rem; letter-spacing: .2em; color: var(--fg-dim); }

/* ════════════════════════════════════════════
   17 — LOGO + CAR (Lightbox-enabled)
════════════════════════════════════════════ */
#logo-projects, #car-projects { padding: 0 2rem 5rem; }
.logo-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 1rem; }

.logo-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; aspect-ratio: 1/1; cursor: none; position: relative;
  transition: all .3s;
}
.logo-card:hover { border-color: rgba(11,89,101,.4); box-shadow: 0 0 40px rgba(11,89,101,.15); }
.logo-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
.logo-card:hover img { transform: scale(1.06); }
.logo-card-overlay {
  position: absolute; inset: 0; background: rgba(7,11,14,.7);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .3s;
  font-family: var(--mono); font-size: .7rem; letter-spacing: .1em; color: var(--fg);
}
.logo-card:hover .logo-card-overlay { opacity: 1; }
.lb-icon { font-size: 1.5rem; display: block; margin-bottom: .4rem; }

.car-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 1rem; }
.car-card {
  position: relative; border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--border); cursor: none; transition: all .3s;
}
.car-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
.car-card:hover { border-color: rgba(0,212,232,.3); transform: translateY(-5px); box-shadow: 0 0 40px rgba(0,212,232,.15); }
.car-card:hover img { transform: scale(1.05); }
.car-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 2rem 1rem 1rem;
  background: linear-gradient(to top, rgba(7,11,14,.9) 0%, transparent 100%);
  opacity: 0; transition: opacity .3s;
}
.car-card:hover .car-overlay { opacity: 1; }
.car-overlay span { font-family: var(--mono); font-size: .7rem; letter-spacing: .15em; color: var(--fg); }
.car-card--wide { grid-column: 1/-1; max-height: 420px; }
.car-card--wide img { object-position: center 30%; }

/* ════════════════════════════════════════════
   18 — CONTACT
════════════════════════════════════════════ */
#contact {
  padding: 5rem 2rem 4rem; text-align: center;
  border-top: 1px solid var(--border); position: relative;
}
#contact::before {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 600px; height: 300px;
  background: radial-gradient(ellipse, rgba(11,89,101,.07) 0%, transparent 70%);
  pointer-events: none;
}
.contact-heading { font-size: clamp(2.8rem,10vw,5.5rem); font-weight: 900; line-height: 1; margin-bottom: .2em; }
.contact-heading .gradient {
  background: linear-gradient(135deg, var(--purple), var(--cyan), var(--pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

/* Copy email button */
.copy-wrap { display: inline-flex; align-items: center; gap: .6rem; margin: 2rem auto 2.5rem; }
.contact-email {
  font-family: var(--mono); font-size: .9rem; color: var(--fg-dim);
  border-bottom: 1px solid var(--cyan); padding-bottom: 4px;
  letter-spacing: .04em; text-decoration: none; transition: color .2s;
}
.contact-email:hover { color: var(--cyan); }
#copy-email-btn {
  font-family: var(--mono); font-size: .62rem; letter-spacing: .1em;
  background: var(--card); border: 1px solid var(--border);
  color: var(--fg-dim); padding: .3rem .6rem; border-radius: 4px;
  cursor: none; transition: all .2s;
}
#copy-email-btn:hover { border-color: var(--cyan); color: var(--cyan); }

.social-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 3rem; }
.social-link {
  width: 46px; height: 46px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--card);
  display: flex; align-items: center; justify-content: center;
  color: var(--fg-dim); text-decoration: none; transition: all .25s;
}
.social-link:hover { border-color: var(--cyan); color: var(--cyan); transform: translateY(-4px) scale(1.1); box-shadow: 0 0 20px rgba(0,212,232,.25); }
.social-link svg { width: 18px; height: 18px; fill: currentColor; }

/* Share button */
#share-btn {
  font-family: var(--mono); font-size: .7rem; letter-spacing: .1em;
  background: var(--card); border: 1px solid var(--border);
  color: var(--fg-dim); padding: .5rem 1rem; border-radius: 6px;
  cursor: none; transition: all .2s; margin-bottom: 2rem;
}
#share-btn:hover { border-color: var(--purple); color: var(--purple); }

footer { font-family: var(--mono); font-size: .6rem; letter-spacing: .15em; color: var(--fg-dim); text-align: center; padding: 1.5rem; border-top: 1px solid var(--border); }
footer span { color: var(--purple); }

/* ════════════════════════════════════════════
   19 — BACK TO TOP
════════════════════════════════════════════ */
#btt {
  position: fixed; bottom: 2rem; right: 2rem; z-index: 200;
  width: 46px; height: 46px; border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  border: none; color: #fff; font-size: 1.1rem; cursor: none;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s;
  box-shadow: 0 4px 0 #063840, 0 8px 25px rgba(11,89,101,.5);
}
#btt.show { opacity: 1; pointer-events: auto; }
#btt:hover { transform: translateY(-5px); }

/* ════════════════════════════════════════════
   20 — FLOATING SHAPES
════════════════════════════════════════════ */
.floating-shape {
  position: fixed; pointer-events: none; z-index: 0; opacity: .04;
  border-radius: 50%; animation: float-shape linear infinite;
}
.fs-1 { width: 80px; height: 80px; top: 20%; left: 5%; background: var(--purple); animation-duration: 15s; }
.fs-2 { width: 50px; height: 50px; top: 70%; right: 8%; background: var(--cyan); animation-duration: 20s; animation-direction: reverse; }
.fs-3 { width: 35px; height: 35px; top: 45%; left: 92%; background: var(--pink); animation-duration: 12s; border-radius: 30%; }
@keyframes float-shape { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-30px) rotate(180deg)} }

/* ════════════════════════════════════════════
   21 — TOAST NOTIFICATIONS
════════════════════════════════════════════ */
#toast {
  position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
  padding: .7rem 1.2rem; font-family: var(--mono); font-size: .72rem;
  color: var(--fg); z-index: 500; opacity: 0;
  transition: all .3s; white-space: nowrap;
  box-shadow: 0 10px 30px rgba(0,0,0,.4);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.success { border-color: var(--cyan); color: var(--cyan); }

/* ════════════════════════════════════════════
   22 — ACCESSIBLE FOCUS STATES
════════════════════════════════════════════ */
:focus-visible { outline: 2px solid var(--purple); outline-offset: 3px; }

/* ════════════════════════════════════════════
   23 — REDUCED MOTION
════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ════════════════════════════════════════════
   24 — RESPONSIVE
════════════════════════════════════════════ */
@media(max-width:768px) {
  .nav-center { display: none; }
  #hero { flex-direction: column-reverse; align-items: flex-start; }
  .avatar-ring { width: 180px; height: 180px; }
  .orbit-1 { width: 240px; height: 240px; }
  .orbit-2 { width: 290px; height: 290px; }
}
@media(max-width:520px) { .cert-grid { grid-template-columns: 1fr; } }
@media(max-width:480px) {
  nav { padding: 1rem 1.2rem; }
  #hero,#about,#projects,#skills,#certificates,#logo-projects,#car-projects,#stats,#contact { padding-left: 1.2rem; padding-right: 1.2rem; }
  .sec-label { padding-left: 1.2rem; padding-right: 1.2rem; }
  .car-grid { grid-template-columns: 1fr; }
  .car-card--wide { grid-column: auto; max-height: none; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
}

/* ── CLIENT PROJECTS ── */
#client-projects { padding: 0 2rem 5rem; }
.client-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 1.2rem; }
.client-card {
  position: relative; border-radius: 14px; overflow: hidden;
  border: 1px solid var(--border); background: var(--card);
  cursor: none; transition: all .35s ease; aspect-ratio: 3/4;
}
.client-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
.client-card:hover { border-color: var(--purple); transform: translateY(-6px); box-shadow: 0 25px 50px rgba(0,0,0,.5), 0 0 40px rgba(11,89,101,.2); }
.client-card:hover img { transform: scale(1.06); }
.client-overlay {
  position: absolute; inset: 0; padding: 1.5rem;
  display: flex; flex-direction: column; justify-content: flex-end;
  background: linear-gradient(to top, rgba(7,11,14,.95) 0%, rgba(7,11,14,.4) 50%, transparent 100%);
  opacity: 0; transition: opacity .35s ease;
}
.client-card:hover .client-overlay { opacity: 1; }
.client-tag { font-family: var(--mono); font-size: .58rem; letter-spacing: .2em; color: var(--purple); background: rgba(11,89,101,.15); border: 1px solid rgba(11,89,101,.3); padding: .25rem .6rem; border-radius: 20px; align-self: flex-start; margin-bottom: .6rem; }
.client-name { font-size: 1rem; font-weight: 700; letter-spacing: .05em; color: var(--fg); margin-bottom: .4rem; }
.client-desc { font-size: .78rem; color: var(--fg-dim); line-height: 1.5; margin-bottom: .8rem; }
.client-view { font-family: var(--mono); font-size: .65rem; letter-spacing: .12em; color: var(--cyan); }
@media(max-width:480px) { .client-grid { grid-template-columns: 1fr; } }


/* ════════════════════════════════════════════
   TEAL THEME — paste at the VERY END of <style>
   (names --purple / --pink are legacy aliases now)
════════════════════════════════════════════ */
:root {
  --bg:       #070B0E;
  --bg2:      #0D1519;
  --fg:       #E8F4F6;
  --fg-dim:   #78939B;
  --fg-muted: #3C5159;
  --purple:   #0B5965;   /* = teal: borders, surfaces, gradients (not text) */
  --cyan:     #00D4E8;   /* accent: small details only */
  --pink:     #B9DCE5;   /* = ice: highlights */
  --border:   rgba(185,220,229,0.08);
  --card:     rgba(13,21,25,0.7);
  --card-hover: rgba(13,21,25,0.9);
}

[data-theme="light"] {
  --bg:       #EEF5F7;
  --bg2:      #E1EDF0;
  --fg:       #070B0E;
  --fg-dim:   #4A646C;
  --fg-muted: #B5CBD1;
  --cyan:     #0B7F8C;   /* neon cyan is unreadable on light */
  --pink:     #0B5965;
  --border:   rgba(7,11,14,0.1);
  --card:     rgba(255,255,255,0.8);
  --card-hover: rgba(255,255,255,0.95);
}
[data-theme="light"] nav { background: rgba(238,245,247,0.85); }

/* ── gradient text: teal alone is too dark on the dark bg ── */
.loader-logo span,
.hero-name .g,
.about-title .highlight,
.contact-heading .gradient,
.stat-num,
.stat-card-num {
  background-image: linear-gradient(135deg, var(--pink), var(--cyan));
}

/* ── small text that was purple ── */
.hero-tag, .badge, .tag, .cert-date { color: var(--pink); }
.sec-label .sec-slash, footer span { color: var(--cyan); }
.hero-tag::before { background: var(--cyan); }
.ticker-item::after { color: var(--purple); }
.tag { border-color: var(--purple); background: rgba(11,89,101,.15); }
.badge { background: rgba(11,89,101,.15); }
:focus-visible { outline-color: var(--cyan); }

/* ── hovers (teal alpha is too faint as border) ── */
.btn-outline:hover, #theme-toggle:hover, #cmd-trigger:hover, #share-btn:hover { border-color: var(--cyan); color: var(--pink); background: rgba(11,89,101,.2); }
.project-item:hover, .cert-card:hover, .skill-card:hover,
.stat-card:hover, .logo-card:hover, .client-card:hover { border-color: var(--purple); }
.nav-link.active { background: rgba(11,89,101,.55); }
.cmd-item:hover, .cmd-item.selected { background: rgba(11,89,101,.4); }
.lb-nav:hover { background: rgba(11,89,101,.5); border-color: var(--cyan); }

/* ── buttons: white text on ice would be unreadable ── */
.btn-primary {
  background: var(--purple); color: #E8F4F6;
  box-shadow: 0 4px 0 #063840, 0 8px 30px rgba(11,89,101,.5);
}
.btn-primary:hover { box-shadow: 0 7px 0 #063840, 0 15px 35px rgba(11,89,101,.6); }
.nav-cv { border-color: var(--purple); }
.nav-cv:hover { border-color: var(--cyan); }
#btt { background: var(--purple); color: #E8F4F6; box-shadow: 0 4px 0 #063840, 0 8px 25px rgba(11,89,101,.5); }
.skip-link { background: var(--purple); color: #E8F4F6; }

/* ── cursor ── */
#cur-ring { border-color: var(--pink); }
#cur-dot { background: var(--cyan); }

/* ── background: keep cyan rare ── */
.aurora-blob { opacity: .09; }
.aurora-blob:nth-child(2), .aurora-blob:nth-child(4) { background: var(--purple); }
.aurora-blob:nth-child(3) { background: var(--pink); opacity: .05; }
.floating-shape.fs-2 { background: var(--purple); }

/* ── avatar (pixel art) ── */
.avatar-ring img { image-rendering: pixelated; }
.avatar-ring { background: conic-gradient(from 0deg, var(--purple), var(--cyan), var(--pink), var(--purple)); }

/* ── light theme: gradients must stay dark enough ── */
[data-theme="light"] .loader-logo span,
[data-theme="light"] .hero-name .g,
[data-theme="light"] .about-title .highlight,
[data-theme="light"] .contact-heading .gradient,
[data-theme="light"] .stat-num,
[data-theme="light"] .stat-card-num {
  background-image: linear-gradient(135deg, #0B5965, #0B7F8C);
}
[data-theme="light"] .hero-tag, [data-theme="light"] .badge,
[data-theme="light"] .tag, [data-theme="light"] .cert-date { color: #0B5965; }

/* ── PROJECT PREVIEW (SALAH STORE) ── */
.project-preview { display:block; margin-bottom:1.5rem; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; transition:border-color .3s, box-shadow .3s; }
.project-preview img { width:100%; height:auto; display:block; transition:transform .5s; }
.project-preview:hover { border-color:var(--cyan); box-shadow:0 0 40px rgba(0,212,232,.15); }
.project-preview:hover img { transform:scale(1.04); }

/* ── FAILSAFE: if JS fails (old browser), loader still hides and hero still shows ── */
@keyframes loader-failsafe { to { opacity:0; visibility:hidden; pointer-events:none; } }
@keyframes show-failsafe { to { opacity:1; } }
#loader { animation: loader-failsafe .6s ease 6s forwards; }
.hero-tag, .hero-role, .hero-desc, .hero-btns, .hero-stats, .avatar-wrap { animation: show-failsafe .01s linear 7s forwards; }

</style>
</head>
